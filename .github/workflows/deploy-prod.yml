name: Deploy — prod

on:
  release:
    types: [published] # Triggers only when a GitHub Release is published (not a draft)

concurrency:
  group: deploy-prod
  cancel-in-progress: false # Never cancel an in-flight deploy

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: prod
  TABLE_NAME: DriftGuard-prod
  STATE_MACHINE_NAME: driftguard-collection-prod
  FRONTEND_BUCKET: driftguard-frontend-${{ secrets.AWS_ACCOUNT_ID }}-prod
  SNAPSHOT_BUCKET: driftguard-snapshots-${{ secrets.AWS_ACCOUNT_ID }}-prod
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}

jobs:
  # ─────────────────────────────────────────────
  # Guard: Re-run CI checks before prod deploy
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI gate (must pass before prod deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements/dev.txt"

      - name: Install dev deps
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Lint — ruff
        working-directory: backend
        run: ruff check .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type check — tsc
        working-directory: frontend
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # Manual approval gate (GitHub Environment: prod)
  # ─────────────────────────────────────────────
  # The 'prod' GitHub Environment must have a required reviewer configured.
  # GitHub will pause execution here until a reviewer approves.
  # Configure at: Settings > Environments > prod > Required reviewers

  # ─────────────────────────────────────────────
  # Backend: Package + Deploy Lambda functions
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend — Lambda functions (prod)
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: prod # <-- This is what triggers the approval gate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements/base.txt"

      - name: Install base dependencies into vendor/
        working-directory: backend
        run: pip install -r requirements/base.txt -t vendor/

      - name: Build backend deployment zip
        working-directory: backend
        run: |
          mkdir -p staging_deploy
          cp -r functions staging_deploy/
          cp -r shared staging_deploy/
          cp -r vendor/. staging_deploy/
          cd staging_deploy && zip -r ../../driftguard-backend.zip . -x "*.pyc" -x "*/__pycache__/*"
          cd ../..

      - name: Upload deployment zip to S3
        run: |
          aws s3 cp driftguard-backend.zip \
            s3://${{ env.SNAPSHOT_BUCKET }}/deployments/driftguard-backend.zip

      - name: Update Lambda function code — all 10 prod functions
        run: |
          FUNCTIONS=(
            "driftguard-settings-prod"
            "driftguard-devices-prod"
            "driftguard-commands-prod"
            "driftguard-collection-orchestrator-prod"
            "driftguard-collection-worker-prod"
            "driftguard-snapshots-prod"
            "driftguard-compare-prod"
            "driftguard-ai-analyze-prod"
            "driftguard-history-prod"
            "driftguard-audit-prod"
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Updating $fn..."
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket "${{ env.SNAPSHOT_BUCKET }}" \
              --s3-key "deployments/driftguard-backend.zip" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn updated."
          done

      - name: Update Step Functions state machine definition (prod)
        run: |
          DEFINITION=$(cat backend/state_machines/collection_workflow.asl.json \
            | sed "s|\${CollectionWorkerArn}|arn:aws:lambda:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:function:driftguard-collection-worker-prod|g" \
            | sed "s|\${DeltaNetTableName}|${{ env.TABLE_NAME }}|g")
          STATE_MACHINE_ARN="arn:aws:states:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:stateMachine:${{ env.STATE_MACHINE_NAME }}"
          aws stepfunctions update-state-machine \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --definition "$DEFINITION" \
            --no-cli-pager

  # ─────────────────────────────────────────────
  # Netmiko Layer: Rebuild if worker deps changed
  # ─────────────────────────────────────────────
  deploy-netmiko-layer:
    name: Deploy Netmiko layer arm64 (prod)
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: prod
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if worker requirements changed
        id: layer-check
        uses: tj-actions/changed-files@v44
        with:
          files: "backend/requirements/worker.txt"

      - name: Configure AWS credentials
        if: steps.layer-check.outputs.any_changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU for arm64
        if: steps.layer-check.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.layer-check.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Netmiko layer for arm64
        if: steps.layer-check.outputs.any_changed == 'true'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/layer-output:/output" \
            public.ecr.aws/sam/build-python3.12:latest-arm64 \
            /bin/bash -c "pip install netmiko -t /output/python/ && echo Build complete"
          cd layer-output && zip -r ../driftguard-netmiko-layer.zip python/

      - name: Publish new layer version (prod)
        if: steps.layer-check.outputs.any_changed == 'true'
        id: publish-layer
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name driftguard-netmiko \
            --description "Netmiko SSH layer for DriftGuard (arm64, Python 3.12)" \
            --zip-file fileb://driftguard-netmiko-layer.zip \
            --compatible-runtimes python3.12 \
            --compatible-architectures arm64 \
            --query 'LayerVersionArn' \
            --output text \
            --no-cli-pager)
          echo "layer_arn=$LAYER_ARN" >> $GITHUB_OUTPUT

      - name: Update prod Lambda layers
        if: steps.layer-check.outputs.any_changed == 'true'
        run: |
          SHARED_LAYER_ARN=$(aws lambda list-layer-versions \
            --layer-name driftguard-shared \
            --query 'LayerVersions[0].LayerVersionArn' \
            --output text)

          for fn in driftguard-collection-worker-prod driftguard-devices-prod; do
            aws lambda update-function-configuration \
              --function-name "$fn" \
              --layers "$SHARED_LAYER_ARN" "${{ steps.publish-layer.outputs.layer_arn }}" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn layer updated."
          done

      - name: Skip — worker.txt unchanged
        if: steps.layer-check.outputs.any_changed != 'true'
        run: echo "backend/requirements/worker.txt unchanged — Netmiko layer rebuild skipped."

  # ─────────────────────────────────────────────
  # Frontend: Build + Deploy to S3 + CloudFront
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend — S3 + CloudFront (prod)
    runs-on: ubuntu-latest
    needs: ci-gate
    environment: prod
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Inject environment secrets into .env.production
        working-directory: frontend
        run: |
          cat > .env.production << EOF
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID=${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID=${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION=${{ env.AWS_REGION }}
          EOF

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Sync build to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.FRONTEND_BUCKET }}/ \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

          aws s3 cp frontend/dist/index.html s3://${{ env.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --no-cli-pager
