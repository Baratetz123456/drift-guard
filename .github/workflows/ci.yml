name: CI — Full Enterprise Checks & E2E Matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Stage 1: Backend Lint & Pytest Suite
  # ─────────────────────────────────────────────
  backend-checks:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements/dev.txt"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Lint — ruff
        working-directory: backend
        run: ruff check .

      - name: Test — pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          AWS_DEFAULT_REGION: ap-southeast-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          TABLE_NAME: DriftGuard-test
          DYNAMODB_ENDPOINT_URL: http://localhost:8000
          KMS_KEY_ID: local

  # ─────────────────────────────────────────────
  # Stage 1: Frontend Type Check & Build
  # ─────────────────────────────────────────────
  frontend-checks:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check — tsc
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build — vite
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_COGNITO_USER_POOL_ID: ap-southeast-1_STUBSTUB
          VITE_COGNITO_CLIENT_ID: stubclientid000000000000000
          VITE_COGNITO_REGION: ap-southeast-1

  # ─────────────────────────────────────────────
  # Stage 2: Comprehensive E2E Matrix & Compliance
  # ─────────────────────────────────────────────
  e2e-matrix:
    name: E2E — Full Matrix (Auth, CRUD, a11y, Security, Print, AI)
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements/dev.txt"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Launch Backend Collector Bridge
        run: |
          python backend/local_collector.py &
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health; then
              echo "Backend health check passed!"
              break
            fi
            sleep 1
          done

      - name: Launch Frontend Server
        run: |
          npx --prefix frontend vite preview --port 5173 &
          for i in {1..30}; do
            if curl -s http://localhost:5173; then
              echo "Frontend preview server ready!"
              break
            fi
            sleep 1
          done

      - name: Run Comprehensive E2E Test Matrix
        working-directory: frontend
        run: npm test
        env:
          VITE_BASE_URL: http://localhost:5173
          CI: "true"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
