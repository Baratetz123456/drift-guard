name: CI — Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Backend: Lint (ruff) + Tests (pytest)
  # ─────────────────────────────────────────────
  backend-checks:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements/dev.txt"

      - name: Install dev dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Lint — ruff
        working-directory: backend
        run: ruff check .

      - name: Test — pytest
        working-directory: backend
        run: pytest --tb=short --cov=functions --cov=shared --cov-report=term-missing
        env:
          AWS_DEFAULT_REGION: ap-southeast-1
          # Moto mocks handle AWS calls — no real credentials needed in CI
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

  # ─────────────────────────────────────────────
  # Frontend: Type Check (tsc) + Build (vite)
  # ─────────────────────────────────────────────
  frontend-checks:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check — tsc
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build — vite
        working-directory: frontend
        run: npm run build
        env:
          # Stub values — only validates that the build succeeds structurally
          VITE_API_BASE_URL: https://stub.execute-api.ap-southeast-1.amazonaws.com/v1
          VITE_COGNITO_USER_POOL_ID: ap-southeast-1_STUBSTUB
          VITE_COGNITO_CLIENT_ID: stubclientid000000000000000
          VITE_COGNITO_REGION: ap-southeast-1
