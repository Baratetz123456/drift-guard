<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#C8FF00" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#C8FF00" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftAmbient" cx="15%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#C8FF00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightAmbient" cx="85%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#C8FF00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="voltageGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Slate-950 Canvas -->
  <rect width="1200" height="420" fill="#020617"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255, 255, 255, 0.025)" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Ambient Glows -->
  <rect width="1200" height="420" fill="url(#centerGlow)"/>
  <rect width="1200" height="420" fill="url(#leftAmbient)"/>
  <rect width="1200" height="420" fill="url(#rightAmbient)"/>

  <!-- Left Symmetrical Circuit Telemetry Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 40 120 L 180 120 L 220 160 L 320 160"/>
    <path d="M 60 210 L 200 210 L 240 180 L 300 180"/>
    <path d="M 30 300 L 160 300 L 210 250 L 310 250"/>
  </g>
  <!-- Left Glowing Circuit Nodes -->
  <circle cx="180" cy="120" r="3" fill="#64748B"/>
  <circle cx="220" cy="160" r="3.5" fill="#C8FF00" filter="url(#voltageGlow)"/>
  <circle cx="200" cy="210" r="3" fill="#64748B"/>
  <circle cx="240" cy="180" r="3.5" fill="#C8FF00" filter="url(#voltageGlow)"/>
  <circle cx="210" cy="250" r="3" fill="#64748B"/>

  <!-- Right Symmetrical Circuit Telemetry Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M 1160 120 L 1020 120 L 980 160 L 880 160"/>
    <path d="M 1140 210 L 1000 210 L 960 180 L 900 180"/>
    <path d="M 1170 300 L 1040 300 L 990 250 L 890 250"/>
  </g>
  <!-- Right Glowing Circuit Nodes -->
  <circle cx="1020" cy="120" r="3" fill="#64748B"/>
  <circle cx="980" cy="160" r="3.5" fill="#C8FF00" filter="url(#voltageGlow)"/>
  <circle cx="1000" cy="210" r="3" fill="#64748B"/>
  <circle cx="960" cy="180" r="3.5" fill="#C8FF00" filter="url(#voltageGlow)"/>
  <circle cx="990" cy="250" r="3" fill="#64748B"/>

  <!-- ============================================================== -->
  <!-- CENTER LOGO GROUP: Exactly matching BrandLogo.tsx              -->
  <!-- ============================================================== -->
  <g transform="translate(365, 92)">
    <!-- Brand Mark: Scale 3.6x from 24x24 grid = 86.4px width/height -->
    <g transform="scale(3.6)">
      <!-- Geometric Shield Container -->
      <path
        d="M4 3.5C4 3.5 12 2.5 12 2.5C12 2.5 20 3.5 20 3.5C20.5 3.5 21 3.9 21 4.5V13C21 17.5 16.8 20.8 12 22C7.2 20.8 3 17.5 3 13V4.5C3 3.9 3.5 3.5 4 3.5Z"
        stroke="#64748B"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="#020617"
      />

      <!-- Straight Baseline Trace -->
      <line
        x1="6"
        y1="14"
        x2="18"
        y2="14"
        stroke="#94A3B8"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <!-- Drifted & Converging Trace -->
      <path
        d="M6 14C8 14 9 8 12 8C14 8 14.8 12.5 16 14"
        stroke="#C8FF00"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#voltageGlow)"
      />

      <!-- Catch-Point Node (Moment of Verification) -->
      <circle cx="16" cy="14" r="1.6" fill="#C8FF00" filter="url(#voltageGlow)"/>
    </g>

    <!-- Wordmark "DriftGuard" -->
    <text
      x="106"
      y="62"
      fill="#F8FAFC"
      font-family="Inter, system-ui, -apple-system, sans-serif"
      font-size="64"
      font-weight="700"
      letter-spacing="-0.03em"
    >DriftGuard</text>

    <!-- v1.2 Badge -->
    <g transform="translate(448, 20)">
      <rect
        x="0"
        y="0"
        width="48"
        height="22"
        rx="11"
        fill="rgba(200, 255, 0, 0.12)"
        stroke="rgba(200, 255, 0, 0.35)"
        stroke-width="1.2"
      />
      <text
        x="24"
        y="15"
        text-anchor="middle"
        fill="#C8FF00"
        font-family="'JetBrains Mono', monospace"
        font-size="11"
        font-weight="700"
      >v1.2</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- Tagline Pill: "Before. After. Understood."                      -->
  <!-- ============================================================== -->
  <g transform="translate(460, 222)">
    <!-- Pill Container -->
    <rect
      x="0"
      y="0"
      width="280"
      height="38"
      rx="19"
      fill="rgba(200, 255, 0, 0.08)"
      stroke="rgba(200, 255, 0, 0.3)"
      stroke-width="1.2"
    />
    <!-- Pulsing Green Dot -->
    <circle cx="24" cy="19" r="4.5" fill="#C8FF00" filter="url(#voltageGlow)"/>
    <circle cx="24" cy="19" r="8" stroke="#C8FF00" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Pill Text -->
    <text
      x="152"
      y="24"
      text-anchor="middle"
      fill="#C8FF00"
      font-family="'JetBrains Mono', monospace"
      font-size="13.5"
      font-weight="700"
      letter-spacing="0.04em"
    >Before. After. Understood.</text>
  </g>

  <!-- ============================================================== -->
  <!-- Operational Sub-Anchor                                         -->
  <!-- ============================================================== -->
  <text
    x="600"
    y="305"
    text-anchor="middle"
    fill="#E2E8F0"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="16"
    font-weight="600"
    letter-spacing="-0.01em"
  >Enterprise Network Change Verification for Cisco Infrastructure</text>

  <!-- Technical Micro-Bar -->
  <g transform="translate(600, 350)" text-anchor="middle">
    <text
      x="0"
      y="0"
      fill="#64748B"
      font-family="'JetBrains Mono', monospace"
      font-size="12"
      letter-spacing="0.02em"
    >
      <tspan fill="#94A3B8">Dual-Phase Snapshots</tspan>
      <tspan fill="#334155">  •  </tspan>
      <tspan fill="#94A3B8">Line-by-Line CLI Diff Engine</tspan>
      <tspan fill="#334155">  •  </tspan>
      <tspan fill="#C8FF00">Strict Read-Only Show Safety</tspan>
    </text>
  </g>
</svg>
