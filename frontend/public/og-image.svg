<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="1080" cy="160" r="280" fill="#c8ff00" opacity="0.04" filter="blur(80px)"/>

  <!-- Header Lockup: The Converged Trace Mark + Wordmark -->
  <g transform="translate(100, 110)">
    <!-- Converged Trace Shield (Scale 3x from 24x24) -->
    <g transform="scale(3)">
      <path
        d="M4 3.5C4 3.5 12 2.5 12 2.5C12 2.5 20 3.5 20 3.5C20.5 3.5 21 3.9 21 4.5V13C21 17.5 16.8 20.8 12 22C7.2 20.8 3 17.5 3 13V4.5C3 3.9 3.5 3.5 4 3.5Z"
        stroke="#64748B"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="#090d16"
      />
      <line
        x1="6"
        y1="14"
        x2="18"
        y2="14"
        stroke="#94A3B8"
        stroke-width="2"
        stroke-linecap="round"
      />
      <path
        d="M6 14C8 14 9 8 12 8C14 8 14.8 12.5 16 14"
        stroke="#C8FF00"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="16" cy="14" r="1.6" fill="#C8FF00" />
    </g>

    <!-- Wordmark -->
    <text x="96" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="600" fill="#f8fafc" letter-spacing="-0.02em">
      DriftGuard
    </text>
  </g>

  <!-- Tagline: "Before. After. Understood." -->
  <text x="100" y="260" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="500" fill="#c8ff00" letter-spacing="-0.01em">
    Before. After. Understood.
  </text>

  <!-- Main Headline -->
  <text x="100" y="330" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="600" fill="#f8fafc" letter-spacing="-0.03em">
    Network Change Verification &amp; Diff Telemetry
  </text>

  <!-- Subtitle Description -->
  <text x="100" y="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Deterministic Cisco snapshot collection, visual state diffing, and advisory operational risk analysis.
  </text>

  <!-- Instrumentation Badges -->
  <g transform="translate(100, 460)">
    <!-- Badge 1: Cisco Read-Only -->
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="4" fill="#c8ff00"/>
    <text x="34" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#f1f5f9">Cisco Read-Only</text>

    <!-- Badge 2: KMS Encrypted -->
    <rect x="216" y="0" width="200" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="236" cy="21" r="4" fill="#c8ff00"/>
    <text x="250" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#f1f5f9">KMS CMK Encrypted</text>

    <!-- Badge 3: Advisory AI Analysis -->
    <rect x="432" y="0" width="210" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="452" cy="21" r="4" fill="#38bdf8"/>
    <text x="466" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#f1f5f9">DriftGuard Analysis</text>
  </g>

  <!-- Bottom Terminal Reference -->
  <g transform="translate(100, 560)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b">
      https://driftguard.network • Enterprise Network Automation Instrument
    </text>
  </g>
</svg>
