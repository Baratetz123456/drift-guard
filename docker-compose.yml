services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: driftguard-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    ports:
      - "8000:8000"
    volumes:
      - ./data/dynamodb:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    restart: unless-stopped

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: driftguard-dynamodb-admin
    environment:
      - DDB_LOCAL_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb-local
    restart: unless-stopped

  driftguard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driftguard-backend
    ports:
      - "3000:3000"
    environment:
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - TABLE_NAME=DeltaNet-local
      - KMS_KEY_ID=local
      - ENVIRONMENT=local
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
    volumes:
      - ./backend:/app
    depends_on:
      - dynamodb-local
    restart: unless-stopped
